<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🪙 Clicker Game</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            user-select: none;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        ::-webkit-scrollbar-thumb {
            background: #6c63ff;
            border-radius: 8px;
        }

        /* ===== APP ===== */
        #app {
            max-width: 1200px;
            width: 100%;
            background: linear-gradient(145deg, #12122a, #0d0d1f);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 0 40px rgba(108, 99, 255, 0.05);
            border: 1px solid rgba(108, 99, 255, 0.15);
            position: relative;
            overflow: hidden;
        }
        #app::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(108, 99, 255, 0.03), transparent 60%);
            pointer-events: none;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(108, 99, 255, 0.15);
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
        }
        .header .title {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd700, #ffb300);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .header .title span {
            font-weight: 300;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.3);
        }
        .header-stats {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }
        .header-stats .stat {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .header-stats .stat .icon {
            font-size: 18px;
        }
        .header-stats .stat .value {
            font-weight: 600;
            color: #fff;
        }
        .header-stats .stat .value.coin {
            color: #ffd700;
        }
        .header-stats .stat .value.cps {
            color: #6c63ff;
        }

        /* ===== MAIN LAYOUT ===== */
        .main {
            display: flex;
            gap: 24px;
            position: relative;
            z-index: 2;
        }
        @media (max-width: 800px) {
            .main {
                flex-direction: column;
            }
        }

        /* ===== LEFT: CLICK AREA ===== */
        .click-area {
            flex: 0 0 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
            position: relative;
        }
        @media (max-width: 800px) {
            .click-area {
                flex: unset;
                width: 100%;
                padding: 10px 0;
            }
        }
        .coin-container {
            position: relative;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .coin-container:active {
            transform: scale(0.92);
        }
        .coin {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(ellipse at 30% 30%, #ffd700, #e6a800);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.25), 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 -8px 24px rgba(0, 0, 0, 0.3), inset 0 8px 24px rgba(255, 255, 200, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            font-weight: 700;
            color: #b8860b;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            border: 4px solid rgba(255, 215, 0, 0.3);
            transition: box-shadow 0.3s ease;
            position: relative;
        }
        .coin:hover {
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.35), 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 -8px 24px rgba(0, 0, 0, 0.3), inset 0 8px 24px rgba(255, 255, 200, 0.4);
        }
        .coin .coin-inner {
            font-size: 32px;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            background: rgba(0, 0, 0, 0.15);
            padding: 8px 20px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 600;
            letter-spacing: 1px;
        }
        .click-power {
            margin-top: 16px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .click-power strong {
            color: #ffd700;
            font-weight: 600;
        }

        /* ===== PARTICLES ===== */
        .particle {
            position: fixed;
            pointer-events: none;
            font-size: 24px;
            font-weight: 700;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            animation: particleFly 0.9s ease-out forwards;
            z-index: 999;
        }
        @keyframes particleFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0.4);
            }
        }
        .particle-burst {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.5), transparent);
            animation: burstFade 0.6s ease-out forwards;
            z-index: 998;
        }
        @keyframes burstFade {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* ===== RIGHT PANEL ===== */
        .panel {
            flex: 1;
            min-width: 0;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px 18px;
            max-height: 540px;
            display: flex;
            flex-direction: column;
        }
        @media (max-width: 800px) {
            .panel {
                max-height: 420px;
            }
        }

        /* ===== TABS ===== */
        .tabs {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 10px;
        }
        .tabs .tab {
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            background: transparent;
            color: rgba(255, 255, 255, 0.4);
            border: 1px solid transparent;
            transition: all 0.25s ease;
        }
        .tabs .tab:hover {
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.04);
        }
        .tabs .tab.active {
            color: #fff;
            background: rgba(108, 99, 255, 0.2);
            border-color: rgba(108, 99, 255, 0.3);
            box-shadow: 0 0 20px rgba(108, 99, 255, 0.05);
        }
        .tabs .tab .badge {
            background: rgba(108, 99, 255, 0.3);
            padding: 0 8px;
            border-radius: 20px;
            font-size: 11px;
            margin-left: 4px;
            color: #aaa;
        }
        .tabs .tab.active .badge {
            background: rgba(108, 99, 255, 0.4);
            color: #fff;
        }

        /* ===== TAB CONTENT ===== */
        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }
        .tab-pane {
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .tab-pane.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== UPGRADE CARDS ===== */
        .upgrade-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .upgrade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s ease;
            cursor: default;
            gap: 10px;
            flex-wrap: wrap;
        }
        .upgrade-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(108, 99, 255, 0.15);
        }
        .upgrade-item.bought {
            opacity: 0.6;
            border-color: rgba(76, 175, 80, 0.2);
        }
        .upgrade-item.bought:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        .upgrade-item .info {
            flex: 1;
            min-width: 120px;
        }
        .upgrade-item .info .name {
            font-weight: 600;
            font-size: 14px;
            color: #fff;
        }
        .upgrade-item .info .desc {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 1px;
        }
        .upgrade-item .info .owned {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 2px;
        }
        .upgrade-item .cost {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            font-weight: 600;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.06);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            white-space: nowrap;
        }
        .upgrade-item .cost .coin-icon {
            font-size: 14px;
        }
        .upgrade-item .cost .cost-value {
            font-size: 14px;
        }
        .upgrade-item .cost.not-enough {
            opacity: 0.4;
            border-color: rgba(255, 0, 0, 0.2);
        }
        .upgrade-item .buy-btn {
            background: linear-gradient(135deg, #6c63ff, #5a52e0);
            border: none;
            color: #fff;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(108, 99, 255, 0.2);
            min-width: 64px;
        }
        .upgrade-item .buy-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(108, 99, 255, 0.35);
        }
        .upgrade-item .buy-btn:active:not(:disabled) {
            transform: scale(0.95);
        }
        .upgrade-item .buy-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .upgrade-item.bought .buy-btn {
            background: #2d7a3a;
        }

        /* ===== GENERATOR CARDS ===== */
        .gen-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s ease;
            cursor: default;
            gap: 10px;
            flex-wrap: wrap;
        }
        .gen-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(108, 99, 255, 0.1);
        }
        .gen-item .info {
            flex: 1;
            min-width: 120px;
        }
        .gen-item .info .name {
            font-weight: 600;
            font-size: 14px;
            color: #fff;
        }
        .gen-item .info .desc {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 1px;
        }
        .gen-item .info .owned {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 2px;
        }
        .gen-item .info .production {
            font-size: 11px;
            color: #6c63ff;
            margin-top: 1px;
        }
        .gen-item .cost {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            font-weight: 600;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.06);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            white-space: nowrap;
        }
        .gen-item .cost .coin-icon {
            font-size: 14px;
        }
        .gen-item .cost .cost-value {
            font-size: 14px;
        }
        .gen-item .cost.not-enough {
            opacity: 0.4;
            border-color: rgba(255, 0, 0, 0.2);
        }
        .gen-item .buy-btn {
            background: linear-gradient(135deg, #ff6b6b, #e05555);
            border: none;
            color: #fff;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(255, 107, 107, 0.2);
            min-width: 64px;
        }
        .gen-item .buy-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(255, 107, 107, 0.35);
        }
        .gen-item .buy-btn:active:not(:disabled) {
            transform: scale(0.95);
        }
        .gen-item .buy-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ===== PRESTIGE ===== */
        .prestige-area {
            text-align: center;
            padding: 12px 0;
        }
        .prestige-area .pp-display {
            font-size: 32px;
            font-weight: 700;
            color: #ff6bff;
            text-shadow: 0 0 30px rgba(255, 107, 255, 0.2);
            margin: 8px 0;
        }
        .prestige-area .pp-desc {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-bottom: 16px;
        }
        .prestige-area .pp-bonus {
            font-size: 14px;
            color: #6c63ff;
            background: rgba(108, 99, 255, 0.08);
            padding: 6px 16px;
            border-radius: 40px;
            display: inline-block;
            margin-bottom: 16px;
            border: 1px solid rgba(108, 99, 255, 0.1);
        }
        .prestige-btn {
            background: linear-gradient(135deg, #ff6bff, #d94fd9);
            border: none;
            color: #fff;
            padding: 12px 40px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 30px rgba(255, 107, 255, 0.3);
        }
        .prestige-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 40px rgba(255, 107, 255, 0.4);
        }
        .prestige-btn:active:not(:disabled) {
            transform: scale(0.95);
        }
        .prestige-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .prestige-info {
            margin-top: 16px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            line-height: 1.6;
        }

        /* ===== ACHIEVEMENTS ===== */
        .ach-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        @media (max-width: 600px) {
            .ach-list {
                grid-template-columns: 1fr;
            }
        }
        .ach-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }
        .ach-item.unlocked {
            border-color: rgba(255, 215, 0, 0.2);
            background: rgba(255, 215, 0, 0.04);
        }
        .ach-item .ach-icon {
            font-size: 24px;
            opacity: 0.3;
            transition: all 0.3s ease;
        }
        .ach-item.unlocked .ach-icon {
            opacity: 1;
        }
        .ach-item .ach-info {
            flex: 1;
        }
        .ach-item .ach-info .ach-name {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
        }
        .ach-item.unlocked .ach-info .ach-name {
            color: #fff;
        }
        .ach-item .ach-info .ach-desc {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
        }
        .ach-item .ach-status {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
        }
        .ach-item.unlocked .ach-status {
            color: #ffd700;
        }

        /* ===== STATS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .stat-item .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-item .stat-value {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-top: 2px;
        }
        .stat-item .stat-value.gold {
            color: #ffd700;
        }
        .stat-item .stat-value.purple {
            color: #6c63ff;
        }
        .stat-item .stat-value.pink {
            color: #ff6bff;
        }
        .stat-item .stat-value.green {
            color: #4caf50;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
            z-index: 2;
        }
        .footer .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .footer .actions button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.5);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .footer .actions button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.1);
        }
        .footer .actions button.primary {
            background: rgba(108, 99, 255, 0.15);
            border-color: rgba(108, 99, 255, 0.2);
            color: #6c63ff;
        }
        .footer .actions button.primary:hover {
            background: rgba(108, 99, 255, 0.25);
            border-color: rgba(108, 99, 255, 0.3);
        }
        .footer .theme-toggle {
            font-size: 20px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 4px 12px;
            transition: all 0.2s ease;
            color: rgba(255, 255, 255, 0.4);
        }
        .footer .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .footer .save-info {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
        }
        .footer .sound-toggle {
            font-size: 20px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 4px 12px;
            transition: all 0.2s ease;
            color: rgba(255, 255, 255, 0.4);
        }
        .footer .sound-toggle:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        /* ===== NOTIFICATION ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            color: #fff;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            z-index: 9999;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast .toast-icon {
            margin-right: 8px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            #app {
                padding: 14px;
                border-radius: 18px;
            }
            .header .title {
                font-size: 20px;
            }
            .header-stats .stat {
                font-size: 12px;
                padding: 4px 10px;
            }
            .coin {
                width: 140px;
                height: 140px;
                font-size: 60px;
            }
            .coin .coin-inner {
                font-size: 22px;
                padding: 4px 14px;
            }
            .click-area {
                flex: unset;
                padding: 6px 0;
            }
            .panel {
                max-height: 380px;
                padding: 12px;
            }
            .tabs .tab {
                font-size: 11px;
                padding: 4px 12px;
            }
            .upgrade-item,
            .gen-item {
                padding: 8px 10px;
            }
            .upgrade-item .info .name,

    <script>
        // ============================================================
        //  SOUND MANAGER (Web Audio)
        // ============================================================
        class SoundManager {
            constructor() {
                this.enabled = true;
                this.ctx = null;
                try {
                    this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.warn('Web Audio not supported');
                }
            }

            resume() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTone(freq, duration, type = 'sine', volume = 0.15, delay = 0) {
                if (!this.enabled || !this.ctx) return;
                this.resume();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
                    gain.gain.setValueAtTime(volume, this.ctx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + delay);
                    osc.stop(this.ctx.currentTime + delay + duration);
                } catch (e) { /* ignore */ }
            }

            playClick() {
                this.playTone(800, 0.08, 'sine', 0.12);
                this.playTone(1200, 0.06, 'sine', 0.08, 0.04);
            }

            playBuy() {
                this.playTone(440, 0.15, 'sine', 0.15);
                setTimeout(() => this.playTone(660, 0.12, 'sine', 0.12), 100);
            }

            playPrestige() {
                const notes = [523, 659, 784, 1047];
                notes.forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 0.2, 'sine', 0.13), i * 120);
                });
                setTimeout(() => this.playTone(130, 0.4, 'sawtooth', 0.08), 300);
            }

            playAchievement() {
                this.playTone(880, 0.15, 'sine', 0.15);
                setTimeout(() => this.playTone(1100, 0.15, 'sine', 0.13), 120);
                setTimeout(() => this.playTone(1320, 0.25, 'sine', 0.18), 240);
            }

            playError() {
                this.playTone(300, 0.25, 'sawtooth', 0.06);
            }

            toggle() {
                this.enabled = !this.enabled;
                if (this.enabled && this.ctx && this.ctx.state === 'suspended') {
                    this.resume();
                }
                return this.enabled;
            }
        }

        const sound = new SoundManager();

        const ACHIEVEMENTS = [{

            check: () => getCps() >= 100,
        }, {
            id: 'cps_1k',
            name: '⚡⚡ 1000 🪙/s',
            desc: 'Osiągnij 1000 monet na sekundę',

        }, {

        }, {

        }, {

            name: '🌟🌟🌟🌟🌟 5 prestiży',

            check: () => state.totalPrestiges >= 5,
        }, ];

        // ============================================================
        //  HELPERS
        // ============================================================
        function getUpgradeLevel(id) { return state.upgrades[id] || 0; }

        function getGenCount(id) { return state.generators[id] || 0; }

        function getPrestigeBonus() {
            return state.prestigePoints * CONFIG.PRESTIGE_BONUS_PER_POINT;
        }

        function getCps() {
            let total = 0;
            for (const gen of GENERATORS) {
                const count = getGenCount(gen.id);
                total += count * gen.baseProduction * (1 + getPrestigeBonus());
            }
            return total;
        }

        function getClickPower() {
            let base = 1;
            for (const upg of UPGRADES) {
                const lvl = getUpgradeLevel(upg.id);
                base += upg.effect(lvl);
            }
            return Math.floor(base * (1 + getPrestigeBonus()));
        }

        function getUpgradeCost(upg) {
            const lvl = getUpgradeLevel(upg.id);
            return Math.floor(upg.baseCost * Math.pow(upg.costMultiplier, lvl));
        }

        function getGenCost(gen) {
            const count = getGenCount(gen.id);
            return Math.floor(gen.baseCost * Math.pow(gen.costMultiplier, count));
        }

        function formatNum(n) {
            if (n < 1000) return Math.floor(n).toString();
            if (n < 1000000) return (n / 1000).toFixed(1) + 'k';
            if (n < 1000000000) return (n / 1000000).toFixed(1) + 'M';
            if (n < 1000000000000) return (n / 1000000000).toFixed(1) + 'B';
            return (n / 1000000000000).toFixed(1) + 'T';
        }

        function formatNumFull(n) {
            return Math.floor(n).toLocaleString();
        }

        function getPrestigeGain() {
            if (state.totalCoinsEarned < 1000) return 0;
            return Math.floor(Math.sqrt(state.totalCoinsEarned / 1000));
        }

        // ============================================================
        //  GAME LOGIC
        // ============================================================
        function clickCoin() {
            sound.playClick();
            const power = getClickPower();
            state.coins += power;
            state.totalCoinsEarned += power;
            state.totalClicks += 1;

            spawnParticles();
            spawnBurst();

            updateUI();
            checkAchievements();
        }

        function buyUpgrade(id) {
            console.log('buyUpgrade called with id:', id);
            const upg = UPGRADES.find(u => u.id === id);
            if (!upg) {
                console.warn('Upgrade not found:', id);
                return;
            }
            const lvl = getUpgradeLevel(id);
            if (lvl >= upg.maxLevel) {
                sound.playError();
                showToast('❌', 'Osiągnięto maksymalny poziom!');
                console.log('Max level reached');
                return;
            }
            const cost = getUpgradeCost(upg);
            if (state.coins < cost) {
                sound.playError();
                showToast('❌', `Brak monet! Potrzebujesz ${formatNum(cost)} 🪙`);
                console.log('Not enough coins, have:', state.coins, 'need:', cost);
                return;
            }
            state.coins -= cost;
            state.upgrades[id] = (state.upgrades[id] || 0) + 1;
            sound.playBuy();
            updateUI();
            checkAchievements();
            saveGame();
            showToast('⬆️', `Kupiono: ${upg.name}`);
            console.log('Upgrade purchased, new level:', state.upgrades[id]);
        }

        function buyGenerator(id) {
            console.log('buyGenerator called with id:', id);
            const gen = GENERATORS.find(g => g.id === id);
            if (!gen) {
                console.warn('Generator not found:', id);
                return;
            }
            const cost = getGenCost(gen);
            if (state.coins < cost) {
                sound.playError();
                showToast('❌', `Brak monet! Potrzebujesz ${formatNum(cost)} 🪙`);
                console.log('Not enough coins, have:', state.coins, 'need:', cost);
                return;
            }
            state.coins -= cost;
            state.generators[id] = (state.generators[id] || 0) + 1;
            sound.playBuy();
            updateUI();
            checkAchievements();
            saveGame();
            showToast('🏭', `Kupiono: ${gen.name}`);
            console.log('Generator purchased, new count:', state.generators[id]);
        }

            const gain = getPrestigeGain();
            if (gain < 1) {
                sound.playError();
                showToast('❌', 'Potrzebujesz co najmniej 1000 zarobionych monet!');
                return;
            }
            if (!confirm(`Czy na pewno chcesz wykonać prestiż?\nZdobywasz ${gain} punktów prestiżu.\nCały postęp zostanie zresetowany!`)) return;

            sound.playPrestige();

            state.prestigePoints += gain;

            state.coins = 0;
            state.totalCoinsEarned = 0;
            state.totalClicks = 0;

        function spawnParticles() {
            const el = document.getElementById('coinEl');
            const rect = el.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            const count = 8 + Math.floor(Math.random() * 10);
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const angle = Math.random() * 2 * Math.PI;
                const dist = 60 + Math.random() * 120;
                const tx = Math.cos(angle) * dist;
                const ty = Math.sin(angle) * dist - 40;
                p.style.setProperty('--tx', tx + 'px');
                p.style.setProperty('--ty', ty + 'px');
                p.textContent = ['+1', '🪙', '✨', '💫', '⭐'][Math.floor(Math.random() * 5)];
                p.style.left = (cx + (Math.random() - 0.5) * 20) + 'px';
                p.style.top = (cy + (Math.random() - 0.5) * 20) + 'px';
                p.style.fontSize = (18 + Math.random() * 18) + 'px';
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 900);
            }
        }

        function spawnBurst() {
            const el = document.getElementById('coinEl');
            const rect = el.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            const burst = document.createElement('div');
            burst.className = 'particle-burst';
            const size = 60 + Math.random() * 80;
            burst.style.width = size + 'px';
            burst.style.height = size + 'px';
            burst.style.left = (cx - size / 2) + 'px';
            burst.style.top = (cy - size / 2) + 'px';
            document.body.appendChild(burst);
            setTimeout(() => burst.remove(), 700);

            let unlocked = 0;
            for (const ach of ACHIEVEMENTS) {
                if (state.achievements[ach.id]) {
                    unlocked++;
                    continue;

                if (ach.check()) {
                    state.achievements[ach.id] = true;

                    sound.playAchievement();

        function renderUpgrades() {
            const container = document.getElementById('upgradeList');
            container.innerHTML = '';
            for (const upg of UPGRADES) {
                const lvl = getUpgradeLevel(upg.id);
                const cost = getUpgradeCost(upg);
                const maxed = lvl >= upg.maxLevel;
                const canAfford = state.coins >= cost && !maxed;

                const div = document.createElement('div');
                div.className = 'upgrade-item' + (maxed ? ' bought' : '');

                const info = document.createElement('div');
                info.className = 'info';
                info.innerHTML = `
              <div class="name">${upg.name}</div>
              <div class="desc">${upg.desc}</div>
              <div class="owned">Poziom: ${lvl} / ${upg.maxLevel} ${maxed ? '✅' : ''}</div>
            `;

                const costEl = document.createElement('div');
                costEl.className = 'cost' + (canAfford ? '' : ' not-enough');
                costEl.innerHTML = `
              <span class="coin-icon">🪙</span>
              <span class="cost-value">${formatNum(cost)}</span>
            `;

                const btn = document.createElement('button');
                btn.className = 'buy-btn';
                btn.textContent = maxed ? 'MAX' : 'Kup';
                btn.disabled = !canAfford && !maxed; // disabled gdy nie stać i nie max
                // Jeśli maxed, przycisk i tak disabled (ale styl inny)
                if (maxed) btn.disabled = true;
                btn.dataset.buyUpgrade = upg.id;

                div.appendChild(info);
                div.appendChild(costEl);
                div.appendChild(btn);
                container.appendChild(div);
            }

        function renderGenerators() {
            const container = document.getElementById('generatorList');
            container.innerHTML = '';
            for (const gen of GENERATORS) {
                const count = getGenCount(gen.id);

              <div class="name">${gen.name}</div>
              <div class="desc">${gen.desc}</div>
              <div class="owned">Posiadane: ${count}</div>
              <div class="production">📈 ${formatNum(prod)}/s</div>
            `;

                const costEl = document.createElement('div');
                costEl.className = 'cost' + (canAfford ? '' : ' not-enough');
                costEl.innerHTML = `
              <span class="coin-icon">🪙</span>
              <span class="cost-value">${formatNum(cost)}</span>
            `;

                const btn = document.createElement('button');
                btn.className = 'buy-btn';
                btn.textContent = 'Kup';
                btn.disabled = !canAfford;
                btn.dataset.buyGenerator = gen.id;

                div.appendChild(info);
                div.appendChild(costEl);
                div.appendChild(btn);
                container.appendChild(div);
            }
        }

        function renderPrestige() {
            const gain = getPrestigeGain();
            document.getElementById('ppCount').textContent = state.prestigePoints;
            const bonus = (getPrestigeBonus() * 100);
            document.getElementById('ppBonusDisplay').textContent =
                `+${bonus.toFixed(1)}% do wszystkich przychodów`;
            const btn = document.getElementById('prestigeBtn');
            btn.disabled = gain < 1;
            document.getElementById('prestigeInfo').innerHTML = `
            Zresetujesz postęp, ale zdobędziesz <strong>${gain}</strong> punktów prestiżu.<br />
            Każdy punkt daje <strong>+5%</strong> do wszystkich przychodów na zawsze.
            ${gain > 0 ? `<br/><span style="color:#ffd700;">➜ Zdobędziesz ${gain} PP</span>` : ''}
          `;
        }

        function renderAchievements() {
            const container = document.getElementById('achList');
            container.innerHTML = '';
            let unlocked = 0;
            for (const ach of ACHIEVEMENTS) {
                const done = !!state.achievements[ach.id];
                if (done) unlocked++;
                const div = document.createElement('div');
                div.className = 'ach-item' + (done ? ' unlocked' : '');
                div.innerHTML = `
              <div class="ach-icon">${done ? '🏆' : '⬜'}</div>
              <div class="ach-info">
                <div class="ach-name">${ach.name}</div>
                <div class="ach-desc">${ach.desc}</div>
              </div>
              <div class="ach-status">${done ? '✅' : '🔒'}</div>
            `;
                container.appendChild(div);
            }
            document.getElementById('achBadge').textContent = unlocked;
        }

        function renderStats() {
            const container = document.getElementById('statsGrid');
            const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
            const hours = Math.floor(elapsed / 3600);
            const minutes = Math.floor((elapsed % 3600) / 60);
            const seconds = elapsed % 60;
            const timeStr = `${hours}h ${minutes}m ${seconds}s`;

            const stats = [{
                label: '💰 Monety',
                value: formatNumFull(state.coins),
                cls: 'gold',
            }, {
                label: '📈 Łącznie zarobione',
                value: formatNumFull(state.totalCoinsEarned),
                cls: 'gold',
            }, {
                label: '👆 Kliknięcia',
                value: formatNumFull(state.totalClicks),
                cls: '',
            }, {
                label: '⚡ Monet/s',
                value: formatNumFull(getCps()),
                cls: 'purple',
            }, {
                label: '💪 Siła kliknięcia',
                value: formatNumFull(getClickPower()),
                cls: '',
            }, {
                label: '⭐ Punkty prestiżu',
                value: state.prestigePoints,
                cls: 'pink',
            }, {
                label: '🌟 Prestiże wykonane',
                value: state.totalPrestiges,
                cls: 'pink',
            }, {
                label: '🏆 Osiągnięcia',
                value: `${getUnlockedCount()}/${ACHIEVEMENTS.length}`,
                cls: 'green',
            }, {
                label: '⏱️ Czas gry',
                value: timeStr,
                cls: '',
            }, {
                label: '📦 Stan gry',
                value: `${Object.keys(state.upgrades).length} ulepszeń, ${Object.keys(state.generators).length} generatorów`,
                cls: '',
            }, ];

            container.innerHTML = '';
            for (const s of stats) {
                const div = document.createElement('div');
                div.className = 'stat-item';
                div.innerHTML = `
              <div class="stat-label">${s.label}</div>
              <div class="stat-value ${s.cls}">${s.value}</div>
            `;
                container.appendChild(div);
            }
        }

        // ============================================================
        //  TOAST
        // ============================================================
        let toastTimeout = null;

        function showToast(icon, msg) {
            const el = document.getElementById('toast');
            el.innerHTML = `<span class="toast-icon">${icon}</span> ${msg}`;
            el.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                el.classList.remove('show');
            }, 2500);
        }

        // ============================================================
        //  SAVE / LOAD
        // ============================================================
        function saveGame() {
            const data = {
                coins: state.coins,
                totalCoinsEarned: state.totalCoinsEarned,
                totalClicks: state.totalClicks,
                clickPower: state.clickPower,
                prestigePoints: state.prestigePoints,
                totalPrestiges: state.totalPrestiges,
                generators: state.generators,
                upgrades: state.upgrades,
                achievements: state.achievements,
                startTime: state.startTime,
                gameTime: state.gameTime,
                lastSave: Date.now(),
            };
            try {
                localStorage.setItem('clickerGameSave', JSON.stringify(data));
                document.getElementById('saveInfo').textContent = 'Zapisano! ' + new Date().toLocaleTimeString();
                setTimeout(() => {
                    document.getElementById('saveInfo').textContent = 'Autozapis co 15s';
                }, 2000);
            } catch (e) {
                console.warn('Save failed', e);
            }
        }

        function loadGame() {
            try {
                const raw = localStorage.getItem('clickerGameSave');
                if (!raw) {
                    showToast('ℹ️', 'Brak zapisanego stanu.');
                    return;
                }
                const data = JSON.parse(raw);

                // Only accept the fields that belong to the game state.
                if (Number.isFinite(Number(data.coins))) state.coins = Number(data.coins);
                if (Number.isFinite(Number(data.totalCoinsEarned))) state.totalCoinsEarned = Number(data.totalCoinsEarned);
                if (Number.isFinite(Number(data.totalClicks))) state.totalClicks = Number(data.totalClicks);
                if (Number.isFinite(Number(data.prestigePoints))) state.prestigePoints = Number(data.prestigePoints);
                if (Number.isFinite(Number(data.totalPrestiges))) state.totalPrestiges = Number(data.totalPrestiges);
                if (Number.isFinite(Number(data.startTime))) state.startTime = Number(data.startTime);
                if (Number.isFinite(Number(data.gameTime))) state.gameTime = Number(data.gameTime);

                state.generators = (data.generators && typeof data.generators === 'object') ? data.generators : {};
                state.upgrades = (data.upgrades && typeof data.upgrades === 'object') ? data.upgrades : {};
                state.achievements = (data.achievements && typeof data.achievements === 'object') ? data.achievements : {};
                state.totalPrestiges = state.totalPrestiges || 0;
                state.prestigePoints = state.prestigePoints || 0;
                state.totalCoinsEarned = state.totalCoinsEarned || 0;
                state.totalClicks = state.totalClicks || 0;
                state.gameTime = state.gameTime || 0;
                updateUI();
                checkAchievements();
                showToast('✅', 'Stan gry wczytany!');
            } catch (e) {
                console.warn('Load failed', e);
                showToast('❌', 'Błąd wczytywania zapisu.');
            }
        }

        function resetGame() {
            if (!confirm('Czy na pewno chcesz zresetować cały postęp?\nTa operacja jest nieodwracalna!')) return;
            if (!confirm('NAPRAWDĘ? Wszystkie dane zostaną usunięte!')) return;
            localStorage.removeItem('clickerGameSave');
            location.reload();
        }

        // ============================================================
        //  THEME TOGGLE
        // ============================================================

        function toggleTheme() {
            darkTheme = !darkTheme;
            const app = document.getElementById('app');
            if (darkTheme) {
                app.style.background = 'linear-gradient(145deg, #12122a, #0d0d1f)';
                document.body.style.background = '#0a0a1a';
                document.getElementById('themeToggle').textContent = '🌙';
            } else {
                app.style.background = 'linear-gradient(145deg, #f0edff, #e8e4ff)';
                document.body.style.background = '#f5f3ff';
                document.getElementById('themeToggle').textContent = '☀️';
            }
            document.body.classList.toggle('light-theme', !darkTheme);
        }

        const styleLight = document.createElement('style');

        // ============================================================
        //  GAME LOOP
        // ============================================================
        let lastTick = Date.now();

        function gameLoop() {
            const now = Date.now();
            const delta = Math.min((now - lastTick) / 1000, 1);
            lastTick = now;

            const cps = getCps();
            if (cps > 0 && delta > 0) {
                const gain = cps * delta;
                state.coins += gain;
                state.totalCoinsEarned += gain;
            }

            state.gameTime += delta;
            updateUI();
            checkAchievements();
        }

        // ============================================================
        //  SHOP CLICK HANDLER
        //  Buttons are recreated by updateUI(), so event delegation makes
        //  buying reliable even while the game is updating.
        // ============================================================
        document.addEventListener('click', (e) => {
            const upgradeBtn = e.target.closest('[data-buy-upgrade]');
            if (upgradeBtn) {
                e.preventDefault();
                e.stopPropagation();
                buyUpgrade(upgradeBtn.dataset.buyUpgrade);
                return;
            }

            const generatorBtn = e.target.closest('[data-buy-generator]');
            if (generatorBtn) {
                e.preventDefault();
                e.stopPropagation();
                buyGenerator(generatorBtn.dataset.buyGenerator);
            }
        });

        // ============================================================
        //  INIT
        // ============================================================
        function init() {
            loadGame();

            document.getElementById('coinContainer').addEventListener('click', clickCoin);

            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    const paneId = 'pane-' + tab.dataset.tab;
                    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                    document.getElementById(paneId).classList.add('active');
                });
            });

            document.getElementById('prestigeBtn').addEventListener('click', doPrestige);
            document.getElementById('saveBtn').addEventListener('click', () => { saveGame();
                showToast('💾', 'Stan gry zapisany!'); });
            document.getElementById('loadBtn').addEventListener('click', loadGame);
            document.getElementById('resetBtn').addEventListener('click', resetGame);
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);

            document.getElementById('soundToggle').addEventListener('click', () => {
                const enabled = sound.toggle();
                document.getElementById('soundToggle').textContent = enabled ? '🔊' : '🔇';
                showToast(enabled ? '🔊' : '🔇', enabled ? 'Dźwięki włączone' : 'Dźwięki wyłączone');
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    clickCoin();
                }
            });

            setInterval(saveGame, CONFIG.SAVE_INTERVAL);
            setInterval(gameLoop, 100);

            updateUI();
            checkAchievements();
            showToast('🪙', 'Klikaj monetę, aby zdobywać monety!');
            console.log('Game initialized, state:', state);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
